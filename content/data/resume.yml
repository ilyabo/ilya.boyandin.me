              de: Titel der Arbeit
            text:
              en: '[Visualization of Temporal Origin-Destination Data](/assets/thesis.pdf)'
              de: '[Visualization of Temporal Origin-Destination Data](/assets/thesis.pdf)'
          - short: false
            label:
              en: Supervised by
              de: Betreut von
            text:
              en: >-
                [Enrico Bertini](https://enrico.bertini.io/) and [Denis
                Lalanne](https://human-ist.unifr.ch/en/institute/team/denis-lalanne.html)
              de: >-
                [Enrico Bertini](https://enrico.bertini.io/) und [Denis
                Lalanne](https://human-ist.unifr.ch/en/institute/team/denis-lalanne.html)
          - short: false
            label:
              en: Summary
              de: Zusammenfassung
            text:
              en: >-
                Carried out an [in-depth study](/assets/thesis.pdf) of temporal
                origin-destination data which can represent movement of people, energy,
                material, etc. between locations in geographic space. Developed
                [Flowstrates](/p/flowstrates), a novel approach for visualizing and
                exploring temporal origin-destination data. Carried out a qualitative
                [user study](/p/flowmap-user-study) comparing animated and
                small-multiple representations of changes in flow maps.
              de: >-
                Durchführung einer [eingehenden Untersuchung](/assets/thesis.pdf)
                zeitabhängiger Quelle-Ziel-Daten, die Bewegungen von Menschen, Energie,
                Materialien usw. zwischen geografischen Orten darstellen können.
                Entwicklung von [Flowstrates](/p/flowstrates), einem neuartigen Ansatz
                zur Visualisierung und Exploration zeitabhängiger Quelle-Ziel-Daten.
                Durchführung einer qualitativen [Nutzerstudie](/p/flowmap-user-study),
                die animierte Darstellungen und Small Multiples zur Darstellung von
                Veränderungen in Flusskarten vergleicht.
